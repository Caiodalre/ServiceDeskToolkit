name: Relatar defeito
description: Informe uma falha reproduzível sem incluir dados corporativos sensíveis.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Não inclua credenciais, tokens, nomes de usuários, endereços internos ou pacotes de suporte.
  - type: input
    id: version
    attributes:
      label: Versão
      description: Informe a tag, versão exibida ou commit.
      placeholder: v3.0.0-rc.3
    validations:
      required: true
  - type: dropdown
    id: powershell
    attributes:
      label: PowerShell
      options:
        - Windows PowerShell 5.1
        - PowerShell 7+
        - Não identificado
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O que aconteceu e qual era o resultado esperado?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra...
        2. Selecione...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências sanitizadas
      description: Remova dados pessoais, corporativos e credenciais.
  - type: checkboxes
    id: safety
    attributes:
      label: Confirmações
      options:
        - label: Revisei o conteúdo e removi informações sensíveis.
          required: true
